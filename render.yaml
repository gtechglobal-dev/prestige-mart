services:
  - type: web
    name: prestige-mart
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: cd backend && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        value: admin@prestigemart.ng
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_KEY
        generateValue: true

  - type: cron
    name: prestige-mart-keep-alive
    runtime: node
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: npm install
    envVars:
      - key: SERVICE_URL
        fromService:
          name: prestige-mart
          type: web
          property: url
    startCommand: node -e "fetch(process.env.SERVICE_URL + '/api/health').then(r => console.log('Ping:', r.status)).catch(e => console.error('Error:', e.message))"
